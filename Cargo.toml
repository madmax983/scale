[package]
name = "scale"
version = "0.1.0"
edition = "2021"
default-run = "scale"

[dependencies]
bevy = { version = "0.15.1", default-features = false, features = ["multi_threaded"] }
bevy_ecs = "0.15.1"
bevy_app = "0.15.1"
bevy_utils = "0.15.1"
bevy_reflect = "0.15.1"
bevy_time = "0.15.1"
bevy_tasks = "0.15.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4.0"
rand = "0.8.5"
ratatui = { version = "0.30.0", default-features = false, features = ["all-widgets", "layout-cache", "macros", "underline-color"] }
ratatui-hypertile = { version = "0.4.2", default-features = false, features = ["serde"] }
ratatui-hypertile-extras = { version = "0.4.2", default-features = false, features = ["serde"] }

anyhow = "1.0"
thiserror = "2.0"
log = "0.4"

rand_distr = "0.4.3"
noise = "0.9.0"
petgraph = "0.6.5"
comfy-table = { version = "7.1.3", default-features = false }
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg", "bmp", "ico", "tiff", "webp"] }

bytemuck = { version = "1.19.0", features = ["derive"] }
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
ratzilla = "0.3.0"

[dev-dependencies]
mockall = "0.13.1"
assert_approx_eq = "1.1.0"
criterion = "0.5"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
strip = true

[features]
default = ["native"]
nova = [] # Feature flag for Nova (Expansion 1) content
native = []
wasm = []

[[example]]
name = "minimal_nova_demo"
required-features = ["nova"]

[[example]]
name = "oral_tradition_demo"
required-features = ["nova"]

[[example]]
name = "test_readme_nova"
# NO required-features, we want it to compile and run with the stub if nova is off

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native-only: terminal, CLI, logging and GPU deps that do not compile for wasm32.
crossterm = "0.29.0"
# comfy-table terminal-width detection (needs crossterm; wasm32 drops it).
comfy-table = { version = "7.1.3", features = ["tty"] }
# ratatui terminal backend (native only; WASM renders via ratzilla).
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
clap = { version = "4.5", features = ["derive"] }
env_logger = "=0.11.0"
wgpu = "24.0.0"
pollster = "0.3.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# getrandom 0.3 (via ahash -> bevy_utils -> bevy) needs its wasm_js feature
# on wasm32; the --cfg hack in .cargo/config.toml is inert for getrandom 0.3.
getrandom = { version = "0.3", features = ["wasm_js"] }

