<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>SCALE WASM</title>
    <!-- ratzilla draws default-colored cells as white text on a transparent
         background, so the page itself has to supply the dark terminal backdrop. -->
    <style>
      body { margin: 0; background-color: #000; }
      /* Each grid row is a <pre>; the browser's default 1em margin would
         make rows taller than the cell height ratzilla measured. */
      pre { margin: 0; }
    </style>
    <!-- wasm-opt must be told about the WASM features rustc enables by default,
         or it rejects the module (e.g. memory.copy needs bulk-memory). -->
    <link data-trunk rel="rust" data-bin="wasm_app"
          data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-multivalue --enable-reference-types" />
  </head>
  <!-- Keep <body> empty: ratzilla's DomBackend sizes its cell grid from the
       body's rect and only falls back to the window size when body has none.
       Any content here shrinks the grid and the first draw indexes past it. -->
  <body></body>
</html>
