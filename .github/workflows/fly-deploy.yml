name: Fly Deploy

on:
  push:
    branches: [trunk]
    paths:
      - "src/**"
      - "lore/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "index.html"
      - "Trunk.toml"
      - "Dockerfile"
      - ".dockerignore"
      - "Caddyfile"
      - "fly.toml"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Build on the runner: Fly's remote builder runs out of memory
      # compiling this crate with LTO.
      - name: Deploy
        run: flyctl deploy --local-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
